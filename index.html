<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Flexbox Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">MySite</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <main class="main-container">
    <section class="text-section">
      <h1 id="main-heading">Welcome to My Styled Page</h1>
      <p class="intro">This is an example of applying external CSS to an HTML document. It uses colors, spacing, and custom fonts!</p>

      <div class="content-box">
        <p>This box is styled with padding, margin, border, and a different background color.</p>
      </div>
    </section>

    <section class="image-section">
      <img src="images/pexels-karymefranca-1535907.jpg" alt="Example image" class="styled-img">
    </section>
  </main>

</body>
</html>
